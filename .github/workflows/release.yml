name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (required for manual trigger)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            goos: linux
            goarch: amd64
            ext: ''
          - os: windows
            goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install UPX
        run: |
          curl -sL -o /tmp/upx.tar.xz https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
          tar -xJf /tmp/upx.tar.xz -C /tmp
          sudo mv /tmp/upx-4.2.4-amd64_linux/upx /usr/local/bin/
          upx --version

      - name: Build controller
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o dist/controller-${{ matrix.os }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/controller/

      - name: Build worker
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o dist/worker-${{ matrix.os }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/worker/

      - name: Compress with UPX
        run: |
          for f in dist/*; do
            if upx --best "$f" 2>/dev/null; then
              echo "UPX compressed: $f"
            else
              echo "UPX skipped (kept original): $f"
            fi
          done

      - name: Show artifact sizes
        run: |
          echo "--- compressed sizes ---"
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: List release assets
        run: ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/controller-*-amd64*
            dist/worker-*-amd64*
            dist/SHA256SUMS.txt
